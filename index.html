<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TimeBlock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat Alternates', sans-serif;
    }
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .priority-primary { border-left: 4px solid #3b82f6; }
    .priority-secondary { border-left: 4px solid #ef4444; }
    .priority-braindump { border-left: 4px solid #10b981; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-xl shadow-md p-6 w-[1100px] flex gap-6">
    
    <!-- Task Section -->
    <div class="w-[40%]">
      <div class="bg-white shadow-md rounded-xl p-4 mb-4">
        <p class="text-center text-gray-400 text-sm font-semibold">Add task here</p>

        <div class="mt-4 space-y-3">
          <!-- Task Blocks -->
          <div class="space-y-3">
            <!-- Task Input Template -->
            <div class="bg-blue-500 rounded-md text-white font-bold text-sm">
              <div class="flex justify-between items-center p-4 cursor-pointer" onclick="toggleInput('top')">
                Top task <span class="text-xl font-bold">+</span>
              </div>
              <div id="input-top" class="hidden p-2 bg-blue-100 text-black">
                <input type="text" id="task-top" class="w-full p-1 rounded mb-2" placeholder="Enter top task">
                <select id="time-top" class="w-full p-1 rounded mb-2 bg-white">
                  <option value="">Select time</option>
                  <!-- Time options -->
                  <script>
                    document.addEventListener('DOMContentLoaded', () => {
                      const times = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);
                      ['top', 'secondary', 'brain'].forEach(id => {
                        const select = document.getElementById(`time-${id}`);
                        times.forEach(time => {
                          const option = document.createElement('option');
                          option.value = time;
                          option.textContent = time;
                          select.appendChild(option);
                        });
                      });
                    });
                  </script>
                </select>
                <button onclick="saveTask('top')" class="bg-blue-600 text-white px-2 py-1 rounded">Save</button>
              </div>
            </div>

    <!-- Loading State -->
    <div id="loading-state" class="flex flex-col items-center justify-center py-12">
      <div class="loading-spinner border-blue-500 border-t-blue-500 mb-4"></div>
      <p>Loading events...</p>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
      </svg>
      <h3 class="mt-2 text-lg font-medium text-gray-900">No events found</h3>
      <p class="mt-1 text-gray-500">Add some events to see them listed here.</p>
      <button onclick="openAddModal()" class="mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700">
        Add New Event
      </button>
    </div>
  </main>

   <!-- Events List -->
   <div id="events-list" class="hidden bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date & Time</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event Type</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody id="events-table-body" class="bg-white divide-y divide-gray-200">
        <!-- Events will be inserted here by JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div id="pagination" class="hidden mt-4 flex items-center justify-between">
    <div>
      <p class="text-sm text-gray-700">
        Showing <span id="page-start">1</span> to <span id="page-end">10</span> of <span id="total-events">0</span> events
      </p>
    </div>
    <div class="flex gap-1">
      <button id="prev-page" class="px-3 py-1 border rounded text-sm disabled:opacity-50" disabled>Previous</button>
      <button id="next-page" class="px-3 py-1 border rounded text-sm disabled:opacity-50" disabled>Next</button>
    </div>
  </div>
</main>

<!-- Add Event Modal -->
<div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-lg p-6 w-96">
    <h3 class="text-lg font-bold mb-4">Add New Event</h3>
    <form id="add-form">
      <div class="mb-4">
        <label for="add-title" class="block text-sm font-medium mb-1">Title *</label>
        <input type="text" id="add-title" class="w-full p-2 border rounded" required>
      </div>
      <div class="mb-4">
        <label for="add-description" class="block text-sm font-medium mb-1">Description</label>
        <input type="text" id="add-description" class="w-full p-2 border rounded">
      </div>
      <div class="mb-4">
        <label for="add-date" class="block text-sm font-medium mb-1">Date *</label>
        <input type="date" id="add-date" class="w-full p-2 border rounded" required>
      </div>
      <div class="mb-4">
        <label for="add-time" class="block text-sm font-medium mb-1">Time *</label>
        <select id="add-time" class="w-full p-2 border rounded" required>
          <option value="">Select time</option>
          <!-- Time options will be added by JavaScript -->
        </select>
      </div>
      <div class="mb-4">
        <label for="add-priority" class="block text-sm font-medium mb-1">Event Type*</label>
        <select id="add-priority" class="w-full p-2 border rounded" required>
          <option value="">Select Event Type</option>
          <option value="PRIMARY">Primary</option>
          <option value="SECONDARY">Secondary</option>
          <option value="BRAINDUMP">Brain Dump</option>
        </select>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded flex items-center gap-2">
          <span id="save-add-text">Add Event</span>
          <div id="save-add-spinner" class="loading-spinner hidden"></div>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Edit Modal -->
<div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-lg p-6 w-96">
    <h3 class="text-lg font-bold mb-4">Edit Event</h3>
    <form id="edit-form">
      <input type="hidden" id="edit-event-id">
      <div class="mb-4">
        <label for="edit-title" class="block text-sm font-medium mb-1">Title *</label>
        <input type="text" id="edit-title" class="w-full p-2 border rounded" required>
      </div>
      <div class="mb-4">
        <label for="edit-description" class="block text-sm font-medium mb-1">Description</label>
        <input type="text" id="edit-description" class="w-full p-2 border rounded">
      </div>
      <div class="mb-4">
        <label for="edit-date" class="block text-sm font-medium mb-1">Date *</label>
        <input type="date" id="edit-date" class="w-full p-2 border rounded" required>
      </div>
      <div class="mb-4">
        <label for="edit-time" class="block text-sm font-medium mb-1">Time *</label>
        <select id="edit-time" class="w-full p-2 border rounded" required>
          <!-- Time options will be added by JavaScript -->
        </select>
      </div>
      <div class="mb-4">
        <label for="edit-priority" class="block text-sm font-medium mb-1">Event Type*</label>
        <select id="edit-priority" class="w-full p-2 border rounded" required>
          <option value="PRIMARY">Primary</option>
          <option value="SECONDARY">Secondary</option>
          <option value="BRAINDUMP">Brain Dump</option>
        </select>
      </div>
      <div class="flex justify-end gap-2">
        <button type="button" onclick="closeEditModal()" class="px-4 py-2 border rounded">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded flex items-center gap-2">
          <span id="save-edit-text">Save Changes</span>
          <div id="save-edit-spinner" class="loading-spinner hidden"></div>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // Configuration
  const BACKEND_URL = 'http://localhost:8080/api/v1/events';
  const LOCAL_STORAGE_KEY = 'timeBlockEvents';
  let backendAvailable = true;
  let currentPage = 1;
  const eventsPerPage = 10;
  let allEvents = [];
  let filteredEvents = [];

  // Initialize when DOM is loaded
  document.addEventListener('DOMContentLoaded', () => {
    // Initialize time dropdowns
    const times = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);
    
    // Add modal time dropdown
    const addTimeSelect = document.getElementById('add-time');
    times.forEach(time => {
      const option = document.createElement('option');
      option.value = time;
      option.textContent = time;
      addTimeSelect.appendChild(option);
    });

    // Edit modal time dropdown
    const editTimeSelect = document.getElementById('edit-time');
    times.forEach(time => {
      const option = document.createElement('option');
      option.value = time;
      option.textContent = time;
      editTimeSelect.appendChild(option);
    });

    // Set today's date as default in add modal
    document.getElementById('add-date').valueAsDate = new Date();

    // Setup form submissions
    document.getElementById('add-form').addEventListener('submit', function(e) {
      e.preventDefault();
      addNewEvent();
    });

    document.getElementById('edit-form').addEventListener('submit', function(e) {
      e.preventDefault();
      saveEditedEvent();
    });

    // Setup filter buttons
    document.getElementById('filter-all').addEventListener('click', () => filterEvents('ALL'));
    document.getElementById('filter-primary').addEventListener('click', () => filterEvents('PRIMARY'));
    document.getElementById('filter-secondary').addEventListener('click', () => filterEvents('SECONDARY'));
    document.getElementById('filter-braindump').addEventListener('click', () => filterEvents('BRAINDUMP'));

    // Setup pagination buttons
    document.getElementById('prev-page').addEventListener('click', goToPreviousPage);
    document.getElementById('next-page').addEventListener('click', goToNextPage);

    // Load events
    loadEvents();
  });

  function loadEvents() {
    showLoadingState(true);
    
    // Try to fetch from backend first
    fetch(BACKEND_URL)
      .then(response => {
        if (!response.ok) {
          backendAvailable = false;
          throw new Error('Failed to fetch events');
        }
        return response.json();
      })
      .then(events => {
        allEvents = events;
        filteredEvents = [...allEvents];
        renderEvents();
      })
      .catch(error => {
        console.log('Loading from local storage');
        // If backend fails, load from local storage
        const localEvents = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY)) || [];
        allEvents = localEvents;
        filteredEvents = [...allEvents];
        renderEvents();
      })
      .finally(() => {
        showLoadingState(false);
      });
  }

  function showLoadingState(show) {
    const loadingElement = document.getElementById('loading-state');
    if (show) {
      loadingElement.classList.remove('hidden');
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('events-list').classList.add('hidden');
      document.getElementById('pagination').classList.add('hidden');
    } else {
      loadingElement.classList.add('hidden');
    }
  }

  function filterEvents(priority) {
    // Reset active state for all filter buttons
    document.querySelectorAll('[id^="filter-"]').forEach(btn => {
      btn.classList.remove('bg-blue-600', 'bg-red-600', 'bg-green-600', 'text-white');
      btn.classList.add('bg-gray-100', 'text-gray-800');
    });

    // Set active state for selected filter
    const activeButton = priority === 'ALL' ? 'filter-all' : 
    priority === 'PRIMARY' ? 'filter-primary' :
    priority === 'SECONDARY' ? 'filter-secondary' : 'filter-braindump';
    document.getElementById(activeButton).classList.remove('bg-gray-100', 'text-gray-800');
    document.getElementById(activeButton).classList.add(
      priority === 'ALL' ? 'bg-blue-600' :
      priority === 'PRIMARY' ? 'bg-blue-600' :
      priority === 'SECONDARY' ? 'bg-red-600' : 'bg-green-600', 
      'text-white'
    );

    if (priority === 'ALL') {
      filteredEvents = [...allEvents];
    } else {
      filteredEvents = allEvents.filter(event => event.priority === priority);
    }

    currentPage = 1;
    renderEvents();
  }

  function renderEvents() {
    const emptyElement = document.getElementById('empty-state');
    const listElement = document.getElementById('events-list');
    const paginationElement = document.getElementById('pagination');
    const tableBody = document.getElementById('events-table-body');

    // Clear existing rows
    tableBody.innerHTML = '';

    if (filteredEvents.length === 0) {
      listElement.classList.add('hidden');
      paginationElement.classList.add('hidden');
      emptyElement.classList.remove('hidden');
      return;
    }

    emptyElement.classList.add('hidden');
    listElement.classList.remove('hidden');
    paginationElement.classList.remove('hidden');

    // Calculate pagination
    const totalPages = Math.ceil(filteredEvents.length / eventsPerPage);
    const startIndex = (currentPage - 1) * eventsPerPage;
    const endIndex = Math.min(startIndex + eventsPerPage, filteredEvents.length);
    const paginatedEvents = filteredEvents.slice(startIndex, endIndex);

    // Update pagination info
    document.getElementById('page-start').textContent = startIndex + 1;
    document.getElementById('page-end').textContent = endIndex;
    document.getElementById('total-events').textContent = filteredEvents.length;
    document.getElementById('prev-page').disabled = currentPage === 1;
    document.getElementById('next-page').disabled = currentPage === totalPages;

    // Render events
    paginatedEvents.forEach(event => {
      const row = document.createElement('tr');
      row.className = `hover:bg-gray-50 ${getPriorityClass(event.priority)}`;
      
      const timeStr = event.eventTime.toString().padStart(5, '0').substring(0, 5);
      const date = new Date(event.eventDate);
      const formattedDate = date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });

      row.innerHTML = `
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="font-medium text-gray-900">${event.title}</div>
        </td>
        <td class="px-6 py-4">
          <div class="text-gray-500 max-w-xs truncate">${event.description || '-'}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <div class="text-gray-900">${formattedDate}</div>
          <div class="text-gray-500">${timeStr}</div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 py-1 text-xs rounded-full ${getPriorityBadgeClass(event.priority)}">
            ${formatPriority(event.priority)}
          </span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <button onclick="openEditModal('${event.id}')" class="text-blue-600 hover:text-blue-900 mr-3">Edit</button>
          <button onclick="deleteEvent('${event.id}')" class="text-red-600 hover:text-red-900">Delete</button>
        </td>
      `;
      tableBody.appendChild(row);
    });
  }

  function getPriorityClass(priority) {
    return `priority-${priority.toLowerCase()}`;
  }

  function getPriorityBadgeClass(priority) {
    switch(priority) {
      case 'PRIMARY': return 'bg-blue-100 text-blue-800';
      case 'SECONDARY': return 'bg-red-100 text-red-800';
      case 'BRAINDUMP': return 'bg-green-100 text-green-800';
      default: return 'bg-gray-100 text-gray-800';
    }
  }

  function formatPriority(priority) {
    switch(priority) {
      case 'PRIMARY': return 'Primary';
      case 'SECONDARY': return 'Secondary';
      case 'BRAINDUMP': return 'Brain Dump';
      default: return priority;
    }
  }

  function goToPreviousPage() {
    if (currentPage > 1) {
      currentPage--;
      renderEvents();
    }
  }

  function goToNextPage() {
    const totalPages = Math.ceil(filteredEvents.length / eventsPerPage);
    if (currentPage < totalPages) {
      currentPage++;
      renderEvents();
    }
  }

  // Modal Functions
  function openAddModal() {
    document.getElementById('add-modal').classList.remove('hidden');
    document.getElementById('add-title').focus();
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.add('hidden');
    document.getElementById('add-form').reset();
  }

  function openEditModal(eventId) {
    document.getElementById('edit-modal').classList.remove('hidden');
    document.getElementById('edit-title').value = 'Loading...';
    document.getElementById('edit-description').value = 'Loading...';
    document.getElementById('edit-date').value = '';
    document.getElementById('edit-time').disabled = true;
    document.getElementById('edit-priority').disabled = true;
    
    let event;
    
    if (backendAvailable) {
      fetch(`${BACKEND_URL}/${eventId}`)
        .then(response => {
          if (!response.ok) throw new Error('Failed to fetch event details');
          return response.json();
        })
        .then(fetchedEvent => {
          event = fetchedEvent;
          populateEditForm(event);
        })
        .catch(error => {
          console.error('Error fetching from backend:', error);
          event = getEventFromStorage(eventId);
          if (event) {
            populateEditForm(event);
          } else {
            alert('Event not found');
            closeEditModal();
          }
        });
    } else {
      event = getEventFromStorage(eventId);
      if (event) {
        populateEditForm(event);
      } else {
        alert('Event not found');
        closeEditModal();
      }
    }

    function getEventFromStorage(eventId) {
      return allEvents.find(event => event.id === eventId);
    }

    function populateEditForm(event) {
      document.getElementById('edit-event-id').value = event.id;
      document.getElementById('edit-title').value = event.title;
      document.getElementById('edit-description').value = event.description || '';
      
      // Format date for input (YYYY-MM-DD)
      const date = new Date(event.eventDate);
      const formattedDate = date.toISOString().split('T')[0];
      document.getElementById('edit-date').value = formattedDate;
      
      // Set time (HH:00)
      const timeStr = event.eventTime.toString().padStart(5, '0').substring(0, 5);
      document.getElementById('edit-time').value = timeStr;
      document.getElementById('edit-priority').value = event.priority;
      
      // Enable fields
      document.getElementById('edit-time').disabled = false;
      document.getElementById('edit-priority').disabled = false;
    }
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
  }

  // CRUD Operations
  function addNewEvent() {
    const title = document.getElementById('add-title').value.trim();
    const description = document.getElementById('add-description').value.trim();
    const date = document.getElementById('add-date').value;
    const time = document.getElementById('add-time').value;
    const priority = document.getElementById('add-priority').value;

    if (!title || !date || !time || !priority) {
      alert('Please fill in all required fields');
      return;
    }

    const newEvent = {
      id: generateId(),
      title: title,
      description: description,
      priority: priority,
      eventDate: date,
      eventTime: time + ':00'
    };

    showLoading('save-add', true);

    if (backendAvailable) {
      fetch(`${BACKEND_URL}/add`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(newEvent)
      })
      .then(response => {
        if (!response.ok) throw new Error('Failed to add event');
        return response.json();
      })
      .then(savedEvent => {
        addEventToStorage(savedEvent);
        closeAddModal();
        loadEvents(); // Refresh the list
      })
      .catch(error => {
        console.error('Error adding event:', error);
        addEventToStorage(newEvent);
        closeAddModal();
        loadEvents(); // Refresh the list
      })
      .finally(() => {
        showLoading('save-add', false);
      });
    } else {
      addEventToStorage(newEvent);
      closeAddModal();
      loadEvents(); // Refresh the list
    }
  }

  function saveEditedEvent() {
    const eventId = document.getElementById('edit-event-id').value;
    const title = document.getElementById('edit-title').value.trim();
    const description = document.getElementById('edit-description').value.trim();
    const date = document.getElementById('edit-date').value;
    const time = document.getElementById('edit-time').value;
    const priority = document.getElementById('edit-priority').value;

    if (!title || !date || !time || !priority) {
      alert('Please fill in all required fields');
      return;
    }

    const updatedEvent = {
      id: eventId,
      title: title,
      description: description,
      priority: priority,
      eventDate: date,
      eventTime: time + ':00'
    };

    showLoading('save-edit', true);

    if (backendAvailable) {
      fetch(`${BACKEND_URL}/update/${eventId}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(updatedEvent)
      })
      .then(response => {
        if (!response.ok) throw new Error('Failed to update event');
        updateEventInStorage(updatedEvent);
        closeEditModal();
        loadEvents(); // Refresh the list
      })
      .catch(error => {
        console.error('Error updating event:', error);
        updateEventInStorage(updatedEvent);
        closeEditModal();
        loadEvents(); // Refresh the list
      })
      .finally(() => {
        showLoading('save-edit', false);
      });
    } else {
      updateEventInStorage(updatedEvent);
      closeEditModal();
      loadEvents(); // Refresh the list
    }
  }

  function deleteEvent(eventId) {
    if (confirm('Are you sure you want to delete this event?')) {
      if (backendAvailable) {
        fetch(`${BACKEND_URL}/delete/${eventId}`, {
          method: 'DELETE'
        })
        .then(response => {
          if (!response.ok) throw new Error('Failed to delete event');
          removeEventFromStorage(eventId);
          loadEvents(); // Refresh the list
        })
        .catch(error => {
          console.error('Error deleting from backend:', error);
          removeEventFromStorage(eventId);
          loadEvents(); // Refresh the list
        });
      } else {
        removeEventFromStorage(eventId);
        loadEvents(); // Refresh the list
      }
    }
  }

  // Storage Helpers
  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2);
  }

  function addEventToStorage(event) {
    allEvents.push(event);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(allEvents));
  }

  function updateEventInStorage(updatedEvent) {
    allEvents = allEvents.map(event => 
      event.id === updatedEvent.id ? updatedEvent : event
    );
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(allEvents));
  }

  function removeEventFromStorage(eventId) {
    allEvents = allEvents.filter(event => event.id !== eventId);
    filteredEvents = filteredEvents.filter(event => event.id !== eventId);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(allEvents));
  }

  function showLoading(buttonId, show) {
    const spinner = document.getElementById(`${buttonId}-spinner`);
    const text = document.getElementById(`${buttonId}-text`);
    
    if (show) {
      spinner.classList.remove('hidden');
      text.classList.add('hidden');
    } else {
      spinner.classList.add('hidden');
      text.classList.remove('hidden');
    }
  }
</script>
</body>
</html>
